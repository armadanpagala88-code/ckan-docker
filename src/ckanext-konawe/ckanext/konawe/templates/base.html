{% ckan_extends %}

{% block styles %}
  {{ super() }}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #000000;
      --accent-color: #004a8d;
      --bg-color: #ffffff;
      --section-bg: #f8f9fa;
      --border-color: #e5e7eb;
      --text-main: #111827;
      --text-muted: #4b5563;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    
    /* Header & Nav - Minimalist */
    .account-masthead {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
    }
    .account-masthead a {
      color: var(--text-main) !important;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 0;
    }
    .navbar .nav > li > a {
      color: var(--text-main) !important;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.85rem;
    }
    
    /* Hero Section - Editorial Style */
    .konawe-hero {
      padding: 80px 0;
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }
    
    .konawe-hero-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .konawe-hero-image-frame {
      width: 100%;
      height: 450px;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 40px;
      border: 1px solid var(--border-color);
      position: relative;
    }
    
    .konawe-hero-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .konawe-hero-text-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    
    .konawe-title {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    
    .konawe-subtitle {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
    }
    
    /* Search Box - Sharp & Minimal */
    .konawe-search-box {
      width: 100%;
      max-width: 600px;
      margin-top: 30px;
    }
    
    .search-input-group {
      display: flex;
      background: white;
      border: 1px solid #ffffff;
      border-radius: 2px;
      overflow: hidden;
      padding: 4px;
    }
    
    .search-input {
      flex-grow: 1;
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      outline: none;
      color: #000;
    }
    
    .search-button {
      background-color: #1a1f36;
      color: white;
      border: none;
      padding: 0 30px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.9rem;
      cursor: pointer;
    }
    
    /* Category Grid - Strict & Sharp */
    .konawe-categories {
      padding: 80px 0;
      background-color: var(--bg-color);
    }
    
    .section-header {
      margin-bottom: 50px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
      display: inline-block;
    }
    
    .section-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      margin: 0;
    }
    
    .konawe-card {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 25px;
      margin-bottom: 20px;
      text-decoration: none !important;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    
    .konawe-card:hover {
      border-color: var(--primary-color);
      background-color: #fcfcfc;
    }
    
    .konawe-card-icon {
      font-size: 28px;
      color: var(--primary-color);
      margin-right: 25px;
      width: 40px;
      text-align: center;
    }
    
    .konawe-card-content {
      flex-grow: 1;
    }
    
    .konawe-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }
    
    .konawe-card-stats {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Footer - Clean */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 60px 0;
      background: #ffffff;
    }
  </style>
{% endblock %}
